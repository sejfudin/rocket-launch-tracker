    password: admin-password
    roles:
      - general-manager

- type: User
  data:
    id: "a3c175ed-01bc-46c4-915c-62f8624139f4"
    email: user@example.com
    name: Test User
    password: user-password
    roles:
      - client

- type: User
  data:
    email: manager@example.com
    name: Manager User
    password: manager-password
    roles:
      - manager

- type: RocketModel
  data:
    name: Colonial Viper
    organization: Twelve Colonies of Kobol

- type: Rocket
  data:
    name: Viper Mk II
    status: ready
  relations:
    owner: User(email=user@example.com)
