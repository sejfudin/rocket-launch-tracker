- type: Activity
  data:
    module: push-notification
    type: push-notification
    payload:
      title: "Test Push Notification"
      body: "This is a test push notification"
      event: sent
      level: log
      provider: aws-fcm

- type: Activity
  data:
    module: email
    type: email
    payload:
      to: ["test@example.com"]
      cc: ["cc@example.com"]
      bcc: ["bcc@example.com"]
      subject: "Test Email"
      body: "This is a test email"
      event: sent
      level: log
      provider: aws-ses
      template: test-email
      templateValues:
        name: "Test User"
        message: "This is a test email"
